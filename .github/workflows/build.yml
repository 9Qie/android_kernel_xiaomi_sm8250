name: Build MIUI_cas_ReSukiSU-SuSFS

# 只构建一个目标：MIUI + cas + KSU(BakaSU) + SuSFS
on:
  workflow_dispatch:
  push:
    branches:
      - bakasu-cas
    paths-ignore:
      - '**/*.md'

jobs:
  build-cas-miui:
    name: Build cas | MIUI | ReSukiSU-SuSFS
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        PKGS="bc bison build-essential ccache curl flex gawk git gnupg gperf \
          imagemagick libncurses-dev lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3"
        # Package names drift between runner images (e.g. libsdl1.2-dev was
        # rewritten as libsdl1.2-compat-dev on Ubuntu noble), and one missing
        # name aborts the whole transaction with apt exit code 100.  Try the
        # bulk install first, then fall back to per-package installs.
        if ! sudo apt-get install -y $PKGS; then
          echo "::warning::bulk apt install failed, retrying package by package"
          sudo apt-get install -y --fix-missing || true
          for p in $PKGS; do
            sudo apt-get install -y "$p" || echo "::warning::unavailable package: $p"
          done
        fi
        # SDL 1.2 is only available under its compat name on newer images.
        dpkg -s libsdl1.2-dev >/dev/null 2>&1 || sudo apt-get install -y libsdl1.2-compat-dev || true

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-cas-miui-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-cas-miui-
          ${{ runner.os }}-kernel-ccache-cas-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxvf Clang-16.0.6-20260807.tar.gz

    - name: Run Build Script (cas + ksu + miui)
      run: |
        chmod +x build_kernel.sh
        echo "Executing command: ./build_kernel.sh cas ksu miui"
        ./build_kernel.sh cas ksu miui

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: MIUI_cas_ReSukiSU-SuSFS-${{ github.run_id }}
        path: APTKernel_*.zip
        compression-level: 0 # 已经被 zip 压缩过，无需再二次压缩
