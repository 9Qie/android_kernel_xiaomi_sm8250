name: Build MIUI_cas_ReSukiSU-SuSFS

# 只构建一个目标：MIUI + cas + KSU(BakaSU) + SuSFS
on:
  workflow_dispatch:
  push:
    branches:
      - bakasu-cas
    paths-ignore:
      - '**/*.md'

jobs:
  build-cas-miui:
    name: Build cas | MIUI | ReSukiSU-SuSFS
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        # Only the tools this kernel build actually invokes.  Older Ubuntu
        # images carried names like lib32readline-dev / liblz4-tool / libxml2 /
        # libsdl1.2-dev that no longer exist, and a single missing name makes
        # apt exit with 100 before anything is compiled.
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ccache curl flex gawk git gnupg gperf \
          imagemagick libncurses-dev libssl-dev libxml2-utils lzop pngcrush \
          rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
        # Optional helpers: warn but never fail the job.
        for p in liblz4-tool libelf-dev; do
          sudo apt-get install -y "$p" || echo "::warning::$p unavailable"
        done
        for c in ccache gcc make zip; do
          command -v "$c" >/dev/null || echo "::warning::missing command $c"
        done

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-cas-miui-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-cas-miui-
          ${{ runner.os }}-kernel-ccache-cas-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxvf Clang-16.0.6-20260807.tar.gz

    - name: Run Build Script (cas + ksu + miui)
      run: |
        chmod +x build_kernel.sh
        echo "Executing command: ./build_kernel.sh cas ksu miui"
        ./build_kernel.sh cas ksu miui

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: MIUI_cas_ReSukiSU-SuSFS-${{ github.run_id }}
        path: APTKernel_*.zip
        compression-level: 0 # 已经被 zip 压缩过，无需再二次压缩
