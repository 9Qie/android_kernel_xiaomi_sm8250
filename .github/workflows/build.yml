name: Build MIUI_cas_ReSukiSU-SuSFS

# 只构建一个目标：MIUI + cas + KSU(BakaSU) + SuSFS
on:
  workflow_dispatch:
  push:
    branches:
      - bakasu-cas
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write # 发布 Release、把刷机包作为附件上传需要写权限
  actions: write # 清理旧 ccache 缓存条目需要写权限

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # build_kernel.sh honours an inherited CCACHE_DIR, so CI and the script
  # always agree on which directory holds the cache.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  # Bump the trailing version whenever the compiler or flags change, so stale
  # objects are not reused under a new configuration.
  CCACHE_KEY: ccache-ecs-cas-miui-v1
  # Past snapshots to keep.  A full kernel cache is ~0.6 GB, so this stays far
  # below the 10 GB per-repository Actions cache quota.
  CCACHE_KEEP: 2
  CLANG_TAG: 16.0.6-20260807

jobs:
  build-cas-miui:
    name: Build cas | MIUI | ReSukiSU-SuSFS
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        # Only the tools this kernel build actually invokes.  Older Ubuntu
        # images carried names like lib32readline-dev / liblz4-tool / libxml2 /
        # libsdl1.2-dev that no longer exist, and a single missing name makes
        # apt exit with 100 before anything is compiled.
        # libxml2 is a hard runtime dependency of the prebuilt lld shipped in
        # the ZyC clang tarball (it links against libxml2.so.2), so it must be
        # present or every link step dies with exit 127.
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ccache curl flex gawk git gnupg gperf \
          imagemagick libncurses-dev libssl-dev libxml2 libxml2-utils lz4 \
          lzop pngcrush rsync schedtool squashfs-tools xsltproc unzip zip \
          zlib1g-dev python3
        # Optional helpers: warn but never fail the job.
        for p in liblz4-tool libelf-dev; do
          sudo apt-get install -y "$p" || echo "::warning::$p unavailable"
        done

    - name: Setup zyc-clang 16 Toolchain
      run: |
        # Kept at $HOME/zyc-clang because build_kernel.sh hardcodes
        # TOOLCHAIN_BIN="$HOME/zyc-clang/bin".  Download only: the extracted
        # tree is several GB and caching it would crowd the ccache out of the
        # 10 GB repository quota.
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        curl -fL --retry 3 -o "Clang-${CLANG_TAG}.tar.gz" \
          "https://github.com/ZyCromerZ/Clang/releases/download/${CLANG_TAG}-release/Clang-${CLANG_TAG}.tar.gz"
        tar -zxf "Clang-${CLANG_TAG}.tar.gz"
        rm -f "Clang-${CLANG_TAG}.tar.gz"

    - name: Install ccache-ECS
      run: |
        # The distro ccache is an old upstream build: no ECS fast path, so any
        # change to include/generated/autoconf.h (i.e. nearly every CONFIG
        # tweak) forces a full preprocessing pass and the cache stops paying
        # for itself.  The ccache-ECS fork keeps a per-source dependency index
        # plus an autoconf snapshot, which is what lets an unchanged object hit
        # even after unrelated CONFIG_* symbols moved.
        url="https://github.com/cctv18/ccache-ECS/releases/download/ccache-ECS-v1.0/linux-x86_64-glibc-binary.zip"
        curl -fsSL "$url" -o /tmp/ccache-ecs.zip
        rm -rf /tmp/ccache-ecs && mkdir -p /tmp/ccache-ecs
        unzip -q /tmp/ccache-ecs.zip -d /tmp/ccache-ecs
        bin=$(find /tmp/ccache-ecs -type f -name ccache | head -n1)
        [ -n "$bin" ] || bin=$(find /tmp/ccache-ecs -type f -perm -u+x | head -n1)
        if [ -z "$bin" ]; then
          echo "::error::ccache-ECS binary not found in the release archive"
          ls -R /tmp/ccache-ecs
          exit 1
        fi
        chmod +x "$bin"
        sudo install -m 0755 "$bin" "$(command -v ccache)"
        ccache --version
        # ECS only kicks in when this is set; exporting it job-wide keeps the
        # stats calls on the same code path as the build itself.
        echo "CCACHE_IS_KERNEL_COMPILING=true" >> "$GITHUB_ENV"

    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        # GitHub caches are immutable, so a fixed key would freeze the cache at
        # its first snapshot.  A per-run key plus restore-keys always pulls in
        # the newest existing snapshot and then stores an updated one.
        key: ${{ env.CCACHE_KEY }}-${{ github.run_id }}
        restore-keys: |
          ${{ env.CCACHE_KEY }}-
          ccache-ecs-cas-miui-
          ccache-ecs-

    - name: Report ccache state before build
      run: |
        mkdir -p "$CCACHE_DIR"
        ccache -M "$CCACHE_MAXSIZE"
        ccache -o compression=true
        ccache -s

    - name: Run Build Script (cas + ksu + miui)
      run: |
        chmod +x build_kernel.sh
        echo "Executing command: ./build_kernel.sh cas ksu miui"
        ./build_kernel.sh cas ksu miui

    - name: Report ccache state after build
      if: always()
      run: |
        ccache -s || true

    - name: Save ccache
      if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ env.CCACHE_KEY }}-${{ github.run_id }}

    - name: Prune old ccache entries
      # Without this every run leaves another snapshot behind until GitHub
      # starts evicting entries this job still depends on.
      if: always()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh cache list --repo "$GITHUB_REPOSITORY" --limit 100 --json key,createdAt |
          python3 -c 'import json,sys;print("\n".join(c["key"] for c in sorted(json.load(sys.stdin), key=lambda c: c["createdAt"], reverse=True)))' |
          grep -E '^ccache-ecs-' |
          tail -n +$((CCACHE_KEEP + 1)) |
          while read -r key; do
            [ -n "$key" ] || continue
            echo "Deleting old ccache: $key"
            gh cache delete "$key" --repo "$GITHUB_REPOSITORY" || true
          done
        gh cache list --repo "$GITHUB_REPOSITORY" --limit 20 || true

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:
        # archive: false 表示上传时不再套一层 zip，把磁盘上的这个文件原样存成工件。
        # 于是「工件」页下载到的就是 AnyKernel3_*.zip 本身，不用再解压一次。
        # 该模式下只能上传单个文件，工件名自动取文件名（name: 参数会被忽略）。
        path: AnyKernel3_*.zip
        archive: false
        if-no-files-found: error
    - name: Fetch matching BakaSU Manager
      # 只取与本次内核 BakaSU 版本号完全一致的 arm64-v8a release 管理器 APK。
      # 版本号取自刷机包名（build_kernel.sh 回读的 KSU_VERSION）；管理器取自
      # BakaSU 官方 Build Manager 的 Manager-release 产物——官方 Release 里的
      # APK 是打标签时才生成的，通常落后于 main 上的版本号，不能直接用。
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        shopt -s nullglob
        ZIP_FILES=(AnyKernel3_*.zip)
        if [ ${#ZIP_FILES[@]} -eq 0 ]; then
          echo "[-] No AnyKernel3_*.zip found; cannot resolve the BakaSU version code."
          exit 1
        fi

        ZIP_NAME=$(basename "${ZIP_FILES[0]}")
        VERSION_CODE=$(printf '%s' "${ZIP_NAME}" | sed -nE 's/^AnyKernel3_BakaSU_([0-9]+)_.*\.zip$/\1/p')
        if [ -z "${VERSION_CODE}" ]; then
          # 关掉 KernelSU 构建时包名里就没有数字版本号：跳过管理器，别让内核构建白跑。
          echo "[!] ${ZIP_NAME} carries no numeric BakaSU version code (was KernelSU disabled?)."
          echo "[!] Shipping the kernel without a manager APK."
          exit 0
        fi
        echo "[*] Kernel was built against BakaSU version code ${VERSION_CODE}"

        # GITHUB_TOKEN 只保证本仓库可读；读公开的 BakaSU 仓库通常也可以，
        # 万一被拒就退回匿名访问再试一次。
        BAKASU_API="repos/Baka-SU/BakaSU"
        gh_api() {
          if gh api "$@" 2> /dev/null; then
            return 0
          fi
          echo "[!] Authenticated API call failed, retrying anonymously: $*" >&2
          env -u GH_TOKEN gh api "$@"
        }

        WORK_DIR=$(mktemp -d)
        trap 'rm -rf "${WORK_DIR}"' EXIT

        APK_NAME=""
        SEEN=""
        RUN_IDS=$(gh_api "${BAKASU_API}/actions/workflows/build-manager.yml/runs?branch=main&event=push&status=success&per_page=30" \
          --jq '.workflow_runs[].id' | head -n 10 || true)

        for RUN_ID in ${RUN_IDS}; do
          ART_ID=$(gh_api "${BAKASU_API}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "Manager-release" and .expired == false) | .id' \
            | head -n 1 || true)
          [ -n "${ART_ID}" ] || continue

          echo "[*] Inspecting Manager-release of BakaSU run ${RUN_ID} (artifact ${ART_ID})"
          rm -f "${WORK_DIR}/manager.zip"
          gh_api "${BAKASU_API}/actions/artifacts/${ART_ID}/zip" > "${WORK_DIR}/manager.zip"

          MATCH=$(unzip -Z1 "${WORK_DIR}/manager.zip" \
            | grep -E "^BakaSU_.*_${VERSION_CODE}-arm64-v8a-release\.apk$" | head -n 1 || true)
          if [ -n "${MATCH}" ]; then
            unzip -o -j "${WORK_DIR}/manager.zip" "${MATCH}" -d . > /dev/null
            APK_NAME="${MATCH}"
            break
          fi

          SEEN="${SEEN} $(unzip -Z1 "${WORK_DIR}/manager.zip" | grep -E '^BakaSU_.*-arm64-v8a-release\.apk$' | head -n 1 || true)"
        done

        if [ -z "${APK_NAME}" ]; then
          # 上游还没为这个版本号出过管理器：宁可只发内核，也不要发版本对不上的 APK。
          echo "[!] No BakaSU manager with version code ${VERSION_CODE} was found."
          echo "[!] arm64-v8a flavours seen:${SEEN:- (none)}"
          echo "[!] Shipping the kernel without a manager APK."
          exit 0
        fi

        test -f "${APK_NAME}"
        unzip -l "${APK_NAME}" | grep -q 'AndroidManifest.xml' || {
          echo "[-] ${APK_NAME} is not a valid APK."
          exit 1
        }
        echo "[+] Fetched ${APK_NAME} ($(stat -c%s "${APK_NAME}") bytes)"

    - name: Upload BakaSU Manager
      uses: actions/upload-artifact@v7
      with:
        # 与刷机包同样的理由：archive: false 让工件页下载到的就是 APK 本身。
        # 上游尚未产出对应版本号时这里没有文件，用 warn 而不是 error，
        # 免得一个可选附件把整次内核构建判成失败。
        path: BakaSU_*-arm64-v8a-release.apk
        archive: false
        if-no-files-found: warn

    - name: Publish Flashable ZIP to Release
      # Release 附件就是磁盘上那些文件本身：点一下下载得到的就是能直接刷入的
      # AnyKernel3 刷机包（以及配套的 BakaSU 管理器 APK），不用解压，也不会再套容器。
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        shopt -s nullglob
        ZIP_FILES=(AnyKernel3_*.zip)
        if [ ${#ZIP_FILES[@]} -eq 0 ]; then
          echo "[-] No AnyKernel3_*.zip found; nothing to publish."
          exit 1
        fi
        # 管理器 APK 是可选的：上游还没为这个版本号出包时这里匹配不到文件。
        APK_FILES=(BakaSU_*-arm64-v8a-release.apk)
        RELEASE_FILES=("${ZIP_FILES[@]}" "${APK_FILES[@]}")

        for RELEASE_FILE in "${RELEASE_FILES[@]}"; do
          echo "[*] Publishing ${RELEASE_FILE}"
        done

        # 标签取刷机包本身的创建时间（文件 mtime，即 build_kernel.sh 打包的时刻），
        # 按 runner 的 UTC 时区输出 YYYYMMDD_HHMMSS；标题仍与刷机包文件名一致。
        ZIP_NAME=$(basename "${ZIP_FILES[0]}")
        BASE_NAME=${ZIP_NAME%.zip}
        TAG=$(date -u -r "${ZIP_FILES[0]}" '+%Y%m%d_%H%M%S')
        KERNEL_RELEASE=$(printf '%s' "${BASE_NAME}" | sed -E 's/^AnyKernel3_BakaSU_[0-9]+_//')
        echo "[*] Release tag: ${TAG}"
        echo "[*] Release title: ${ZIP_NAME}"

        # 管理器只有真取到对应版本号时才写进说明；printf -v 保留结尾换行。
        MANAGER_LINE=""
        if [ ${#APK_FILES[@]} -gt 0 ]; then
          printf -v MANAGER_LINE -- '- BakaSU 管理器：%s\n' "${APK_FILES[0]}"
        fi

        NOTES=$(printf 'AnyKernel3 刷机包，可直接刷入，无需解压。\n\n- 内核 release：%s\n%s- 构建提交：%s\n- 构建运行：%s/%s/actions/runs/%s\n' \
          "${KERNEL_RELEASE}" "${MANAGER_LINE}" "${GITHUB_SHA}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")

        if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
          # 同一提交重跑：标签已存在，覆盖同名附件而不是新建 Release。
          gh release upload "${TAG}" "${RELEASE_FILES[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${ZIP_NAME}" --notes "${NOTES}"
        else
          # --target 让标签精确指向这次构建的提交，而不是默认分支的当前 HEAD。
          gh release create "${TAG}" "${RELEASE_FILES[@]}" --repo "${GITHUB_REPOSITORY}" --title "${ZIP_NAME}" --notes "${NOTES}" --target "${GITHUB_SHA}" --latest
        fi

        echo "[+] Release ${TAG} now carries:"
        gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name'
